# 배포된 사이트를 헤드리스 브라우저로 열어 콘솔 오류와 화면 상태를 점검합니다. Actions 탭에서 수동 실행.
name: Smoke test
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - shell: bash
        run: |
          exec > >(tee /tmp/out) 2>&1
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            p.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') console.log('console', m.type(), m.text()); });
            p.on('pageerror', e => console.log('pageerror', e.message));
            p.on('requestfailed', r => console.log('reqfail', r.url(), r.failure().errorText));
            const base = 'https://hbyim.github.io/routejourney/';
            for (const h of ['', '#/explore', '#/new', '#/login']) {
              await p.goto(base + '?v=' + Date.now() + h, { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
              console.log('== ' + (h || '#/'), (await p.locator('#app').innerText()).replace(/\s+/g, ' ').slice(0, 300));
            }
            console.log('mode', await p.evaluate(() => !!(window.RL_CONFIG && window.RL_CONFIG.supabaseUrl)));
            await b.close();
          })();
          JS
          node s.js
      - if: always()
        shell: bash
        run: echo "::notice::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/out)"
