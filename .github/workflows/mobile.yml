# 안드로이드·iOS 앱 빌드 확인. 안드로이드는 설치용 APK와 스토어 업로드용 AAB(서명 전)를 만들고, iOS는 시뮬레이터용으로 빌드만 확인합니다.
name: Mobile build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'js/**', 'css/**', 'index.html', '.github/workflows/mobile.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run copy-web && npx cap sync android
      - name: 서명 키 준비 (비밀값이 있을 때만)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - run: cd android && ./gradlew --no-daemon assembleDebug bundleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 스토어용 AAB 서명 확인
        run: |
          if keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab >/tmp/cert 2>&1 && grep -q Owner /tmp/cert; then
            echo "::notice::AAB 서명됨 (버전 코드 ${{ github.run_number }}): $(grep -m1 Owner /tmp/cert)"
          else echo "::warning::AAB가 서명되지 않았어요. ANDROID_KEYSTORE_* 비밀값을 넣어야 스토어에 올릴 수 있어요."; fi
      - uses: actions/upload-artifact@v4
        with:
          name: routelog-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci && npm run copy-web && npx cap sync ios
      - run: xcodebuild -version && xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
        shell: bash -o pipefail {0}
