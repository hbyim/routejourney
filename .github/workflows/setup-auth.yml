# Supabase 메일 인증 설정(Resend SMTP, 인증번호 템플릿, Confirm email)을 Management API로 넣습니다. Actions 탭에서 수동 실행.
# 필요한 저장소 비밀값: SUPABASE_ACCESS_TOKEN(개인 토큰), RESEND_API_KEY
# apply=false 이면 현재 설정만 보여주고 바꾸지 않습니다.
name: Setup Supabase Auth
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 설정을 실제로 바꿀지
        type: boolean
        default: false
      sender:
        description: 보내는 주소(비우면 Resend에서 인증된 도메인의 no-reply@도메인)
        default: ''
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          exec > >(tee /tmp/out) 2>&1
          fail() { echo "ERROR: $*"; sleep 1; echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/out)"; exit 1; }
          REF=$(grep -oP "supabaseUrl:\s*'https://\K[a-z0-9]+" js/config.js)
          [ -n "$SB_TOKEN" ] || fail "SUPABASE_ACCESS_TOKEN 비밀값이 없어요"
          [ -n "$RESEND_KEY" ] || fail "RESEND_API_KEY 비밀값이 없어요"
          echo "project $REF"

          echo "== resend domains"
          curl -s https://api.resend.com/domains -H "Authorization: Bearer $RESEND_KEY" > /tmp/dom
          jq -c '[.data[]? | {name, status, region}]' /tmp/dom 2>/dev/null || head -c 300 /tmp/dom; echo
          SENDER='${{ github.event.inputs.sender }}'
          if [ -z "$SENDER" ]; then
            D=$(jq -r '[.data[]? | select(.status=="verified") | .name][0] // empty' /tmp/dom)
            [ -n "$D" ] || fail "Resend에 인증된 도메인이 없거나 키로 도메인 목록을 읽을 수 없어요. sender 입력을 채워 다시 실행하세요"
            SENDER="no-reply@$D"
          fi
          echo "sender $SENDER"

          echo "== current auth config"
          code=$(curl -s -o /tmp/cfg -w '%{http_code}' "https://api.supabase.com/v1/projects/$REF/config/auth" -H "Authorization: Bearer $SB_TOKEN")
          [ "$code" = 200 ] || fail "Supabase 설정을 읽지 못했어요(HTTP $code): $(head -c 200 /tmp/cfg)"
          jq -c '{site_url, mailer_autoconfirm, mailer_otp_exp, mailer_otp_length, smtp_host, smtp_admin_email, rate_limit_email_sent, mailer_subjects_confirmation, mailer_subjects_recovery}' /tmp/cfg

          if [ '${{ github.event.inputs.apply }}' != 'true' ]; then
            echo "apply=false, 바꾸지 않음"
          else
            jq -n --arg pass "$RESEND_KEY" --arg sender "$SENDER" \
              --rawfile signup supabase/email/confirm-signup.html \
              --rawfile recovery supabase/email/reset-password.html '{
                smtp_host: "smtp.resend.com", smtp_port: "465", smtp_user: "resend", smtp_pass: $pass,
                smtp_admin_email: $sender, smtp_sender_name: "루트로그", smtp_max_frequency: 60,
                rate_limit_email_sent: 100,
                mailer_otp_exp: 600, mailer_otp_length: 6,
                mailer_subjects_confirmation: "[루트로그] 가입 인증번호",
                mailer_templates_confirmation_content: $signup,
                mailer_subjects_recovery: "[루트로그] 비밀번호 재설정 인증번호",
                mailer_templates_recovery_content: $recovery,
                mailer_autoconfirm: false
              }' > /tmp/body
            code=$(curl -s -o /tmp/res -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
              -H "Authorization: Bearer $SB_TOKEN" -H 'Content-Type: application/json' --data @/tmp/body)
            [ "$code" = 200 ] || fail "설정 변경 실패(HTTP $code): $(head -c 300 /tmp/res)"
            echo "== applied"
            jq -c '{mailer_autoconfirm, mailer_otp_exp, mailer_otp_length, smtp_host, smtp_admin_email, rate_limit_email_sent, mailer_subjects_confirmation, mailer_subjects_recovery}' /tmp/res
          fi
          sleep 1; echo "::notice::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/out)"
