# Supabase 인증의 사이트 주소(Site URL)와 허용 주소 목록을 바꿉니다. Actions 탭에서 수동 실행.
# 필요한 저장소 비밀값: SUPABASE_ACCESS_TOKEN(sbp_ 개인 토큰)
name: Set Supabase Site URL
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 사이트 주소
        default: 'https://mytripatoz.com/'
jobs:
  set:
    runs-on: ubuntu-latest
    env:
      SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SITE: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          exec > >(tee /tmp/out) 2>&1
          REF=$(grep -oP "supabaseUrl:\s*'https://\K[a-z0-9]+" js/config.js)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          curl -s "$API" -H "Authorization: Bearer $SB_TOKEN" | jq -c '{site_url, uri_allow_list}'
          # 새 주소, 예전 주소(리다이렉트), 안드로이드·iOS 앱 내부 주소를 모두 허용한다
          ALLOW="${SITE%/}/**,https://hbyim.github.io/routejourney/**,capacitor://localhost/**,https://localhost/**"
          code=$(jq -n --arg site "$SITE" --arg allow "$ALLOW" '{site_url: $site, uri_allow_list: $allow}' | curl -s -o /tmp/res -w '%{http_code}' -X PATCH "$API" -H "Authorization: Bearer $SB_TOKEN" -H 'Content-Type: application/json' --data @-)
          echo "PATCH $code"; jq -c '{site_url, uri_allow_list}' /tmp/res 2>/dev/null || head -c 300 /tmp/res
          sleep 1; echo "::notice::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/out)"
          [ "$code" = 200 ]
