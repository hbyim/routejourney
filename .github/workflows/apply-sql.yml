# supabase/migrations 의 SQL 파일을 Supabase에 실행합니다(Management API). Actions 탭에서 수동 실행.
# 필요한 저장소 비밀값: SUPABASE_ACCESS_TOKEN(sbp_ 개인 토큰)
# apply=false 이면 같은 SQL을 트랜잭션 안에서 실행한 뒤 되돌려서(rollback) 오류만 확인합니다.
name: Apply SQL migration
on:
  workflow_dispatch:
    inputs:
      file:
        description: 실행할 파일 (supabase/migrations/ 아래)
        required: true
      apply:
        description: 실제로 적용할지
        type: boolean
        default: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FILE: ${{ github.event.inputs.file }}
      APPLY: ${{ github.event.inputs.apply }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          exec > >(tee /tmp/out) 2>&1
          fail() { echo "ERROR: $*"; sleep 1; echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/out)"; exit 1; }
          REF=$(grep -oP "supabaseUrl:\s*'https://\K[a-z0-9]+" js/config.js)
          SB_TOKEN=$(printf %s "$SB_TOKEN" | tr -d '[:space:]')
          [ -n "$SB_TOKEN" ] || fail "SUPABASE_ACCESS_TOKEN 비밀값이 없어요"
          case "$FILE" in */*|*..*) fail "파일 이름만 넣어주세요";; esac
          P="supabase/migrations/$FILE"
          [ -f "$P" ] || fail "$P 파일이 없어요"
          API="https://api.supabase.com/v1/projects/$REF/database/query"
          run() { jq -n --arg q "$1" '{query: $q}' > /tmp/body; curl -s -o /tmp/res -w '%{http_code}' -X POST "$API" -H "Authorization: Bearer $SB_TOKEN" -H 'Content-Type: application/json' --data @/tmp/body; }
          if [ "$APPLY" = true ]; then SQL=$(cat "$P"); echo "== apply $P"; else SQL="begin;
          $(cat "$P")
          rollback;"; echo "== dry run (rollback) $P"; fi
          code=$(run "$SQL")
          echo "HTTP $code"; head -c 1500 /tmp/res; echo
          [ "$code" = 200 ] || [ "$code" = 201 ] || fail "SQL 실행 실패"
          echo "== check"
          code=$(run "select tablename, policyname, qual from pg_policies where schemaname='public' and (tablename='posts' and policyname='posts_read' or tablename='location_logs') order by 1,2;")
          head -c 1500 /tmp/res; echo
          code=$(run "select to_regclass('public.location_logs') as logs, (select count(*) from pg_proc where proname in ('can_read_post','listed','purge_location_logs')) as funcs, (select string_agg(jobname||' '||schedule, ', ') from cron.job where jobname='purge-location-logs') as cron;")
          head -c 800 /tmp/res; echo
          sleep 1; echo "::notice::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/out)"
